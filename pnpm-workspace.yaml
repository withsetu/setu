packages:
  - 'packages/*'
  - 'apps/*'

# vitest 3.2.7 — disable the worker's birpc heartbeat timeout (#495).
#
# WHAT IT PATCHES: one line of vitest/dist/chunks/rpc.-pEldfrD.js — `timeout: -1` on the
# worker's `createBirpc` options, which is byte-for-byte what vitest 4 does upstream
# (vitest-dev/vitest#8297, shipped in 4.0.0-beta.4; the 3.x line never got it).
#
# WHY: birpc's DEFAULT_TIMEOUT is 60s and the deadline is measured IN THE WORKER, starting
# when the worker calls the main thread. `onTaskUpdate` is progress reporting — the main
# thread answers it in milliseconds — but if the worker's event loop cannot PROCESS that
# reply within 60s (blocked by synchronous test code, or simply starved of CPU), the timers
# phase fires the deadline before the poll phase delivers the reply that already arrived.
# The rejection surfaces through vitest's unhandled-error channel, so a suite with 0 failing
# tests exits 1 with "Errors 1 error" and nothing actionable in the output. Observed on
# @setu/core in run 30169048156 (1414 passed, 0 failed, job red), where CI contention had
# stretched a 5.7s local run to 132s wall.
# Reproduced deterministically by blocking a worker for 75s: without this patch the run is
# green-but-red with exactly that error; with it, green. See the #495 PR for both runs.
#
# EXPIRY: delete this entry and patches/vitest@3.2.7.patch when the repo moves to vitest 4,
# which carries the same change upstream — tracked by #949. A
# vitest version bump makes `pnpm install` fail loudly on the unapplied patch rather than
# silently reintroducing the flake.
patchedDependencies:
  vitest@3.2.7: patches/vitest@3.2.7.patch

# Audit allowlist for the CI gate (ci.yml "pnpm audit (gate: high)"). The gate runs
# pnpm 11, which reads auditConfig from pnpm-workspace.yaml — not from package.json's
# `pnpm` key — so ci.yml copies this file into its probe dir alongside the lockfile.
# The pre-existing package.json allowlist (GHSA-67mh-4wv8-2f99, moderate esbuild SSRF
# via drizzle-kit — never gates at high+) stays where it is for local pnpm 10 runs.
# ignoreGhsas has no expiry mechanism, so every entry must (a) cover an advisory with
# NO patched release inside the affected major and (b) carry a tracking issue that is
# the entry's expiry.
auditConfig:
  ignoreGhsas:
    # GHSA-mh99-v99m-4gvg (brace-expansion DoS) was allowlisted here because no patched
    # 1.x existed. One does now — 1.1.17 — so the entry's own expiry condition (#881) is
    # met and it is gone rather than renewed. The `brace-expansion@1` override in the root
    # package.json moved to 1.1.18, which clears BOTH that advisory and the newer
    # GHSA-rgw5-rvv9-x895 (first patched 1.x: 1.1.18). Do not re-add either GHSA: an
    # allowlist entry is for an advisory with no patched release inside the affected
    # major, and both now have one.
    # react-router RSC-mode CSRF (high). Patched only in 8.3.0; no 7.x backport
    # exists, and react-router-dom (what apps/admin depends on) has no v8 at all as
    # of 2026-07-25, so moving off the range is a major migration, not a bump. Per
    # the advisory the flaw is reachable only through the unstable RSC APIs; the
    # admin has zero unstable_* react-router imports (grep-verified 2026-07-25).
    # Expiry/re-check: #882.
    - GHSA-qwww-vcr4-c8h2
