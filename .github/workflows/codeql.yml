name: CodeQL

# GitHub-native SAST (OWASP A05 Injection / A08 Integrity — docs/security-standards.md).
# Single-language repo: JavaScript/TypeScript via the combined `javascript-typescript`
# analyzer, default query suite (no custom query packs yet).
# Triggers: pull_request + push to main (so main always has a fresh alert baseline) + a weekly
# cron.
# PR-time SAST was removed in #462 because CodeQL was a large share of PRIVATE-repo Actions
# minutes, with a note here to restore it "if the repo goes public (Actions free)". The repo went
# public on 2026-07-14, so that precondition is met and #1071 restored it.
# The tradeoff #462 accepted turned out to bite: a finding caught only AFTER merge lands on main
# as somebody else's problem, and the gate then sat red for 12 consecutive runs (2026-08-24 →
# 2026-08-28) with nobody acting on it. A red check on your OWN PR cannot be inherited that way,
# which is the property being bought back here — not merely earlier detection.
# github/codeql-action is GitHub-owned — tag-pinned (@v4, current major per
# https://github.com/github/codeql-action/releases), matching ci.yml's convention for
# github/* and actions/* actions (see .github/workflows/ci.yml).
# Security CI foundation: #218 · CI epic: #216 · security standards: docs/security-standards.md.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly full-repo scan (05:44 UTC Wednesdays — off-peak, and clear of ci.yml's
    # 03:17 UTC Monday weekly job so the two never contend for runner minutes).
    - cron: '44 5 * * 3'

# push-to-main and the weekly cron both evaluate `github.ref` to `refs/heads/main`, so a
# ref-keyed group made them cancel each other and a cancelled run reports as *cancelled*,
# not failed — the scan would go missing silently. Neither event has anything to supersede,
# so they key on the event + commit and never cancel (#817).
# A pull_request run DOES have something to supersede — its own earlier commits — so it keys on
# the PR number and cancels, which is the opposite case and must not inherit the #817 rule. Only
# the superseded run is discarded; the newest commit is always scanned before merge.
concurrency:
  group: codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # Default query suite — no custom packs configured yet.

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      # `upload: never` — code-scanning upload (the Security tab) requires GHAS on
      # PRIVATE repos (verified live: the analysis itself ran fine, only the upload was
      # rejected — run 28626097162). That constraint no longer applies: the repo has been
      # public since 2026-07-14, so the upload path is available and this workaround is
      # retirable — #829 owns doing that deliberately, without losing the gate. Until then
      # we gate on the SARIF directly below. When it lands: remove `upload: never` and the
      # two steps below. (This comment previously said "until the repo goes public
      # (MIT/OSS plan)" — both halves were stale; the licence is AGPL-3.0-only, #1020.)
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
          upload: never
          output: codeql-results

      # The honest substitute for the Security tab on a private/Free repo: fail the
      # check on any NEW finding. Known findings live in .github/codeql-known-findings.json
      # (fingerprint = ruleId + file uri; every entry carries a tracking issue — removing
      # the entry once fixed is that issue's DoD). Same allowlist policy as the axe lanes.
      - name: Gate on NEW findings (SARIF vs known-findings allowlist)
        run: |
          new=$(jq --slurpfile known .github/codeql-known-findings.json '
            [.runs[].results[]
             | {ruleId, uri: .locations[0].physicalLocation.artifactLocation.uri, msg: .message.text, line: (.locations[0].physicalLocation.region.startLine // 0)}
             | select(. as $r | [$known[0].known[] | select(.ruleId == $r.ruleId and .uri == $r.uri)] | length == 0)
            ]' codeql-results/javascript.sarif)
          total=$(jq '[.runs[].results[]] | length' codeql-results/javascript.sarif)
          newcount=$(printf '%s' "$new" | jq 'length')
          echo "CodeQL findings: $total total, $newcount new (not in the allowlist)"
          jq -r --slurpfile known .github/codeql-known-findings.json '
            .runs[].results[]
            | {ruleId, uri: .locations[0].physicalLocation.artifactLocation.uri, line: (.locations[0].physicalLocation.region.startLine // 0)}
            | . as $r
            | (if ([$known[0].known[] | select(.ruleId == $r.ruleId and .uri == $r.uri)] | length) > 0 then "  known " else "  NEW   " end) + "\($r.ruleId): \($r.uri):\($r.line)"' codeql-results/javascript.sarif
          if [ "$newcount" != "0" ]; then
            echo "::error::CodeQL found $newcount NEW finding(s) — fix them or triage into .github/codeql-known-findings.json with a tracking issue."
            printf '%s' "$new" | jq -r '.[] | "  \(.ruleId): \(.uri):\(.line) — \(.msg)"'
            exit 1
          fi

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif
          path: codeql-results/
          retention-days: 14
