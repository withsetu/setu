packages:
  - 'packages/*'
  - 'apps/*'

# Audit allowlist for the CI gate (ci.yml "pnpm audit (gate: high)"). The gate runs
# pnpm 11, which reads auditConfig from pnpm-workspace.yaml — not from package.json's
# `pnpm` key — so ci.yml copies this file into its probe dir alongside the lockfile.
# Local pnpm 10 reads it from here too; the old `pnpm.auditConfig` block in package.json
# (GHSA-67mh-4wv8-2f99, a moderate that never gates at high+) was read by neither and is
# gone (#1203).
# Every ignoreGhsas entry must (a) cover an advisory with NO patched release for the
# version range we install and (b) carry an `Expiry: #N` tracking issue in the comment
# directly above it. That expiry is ENFORCED (#1152): .github/workflows/audit-allowlist.yml
# runs scripts/audit-allowlist-expiry.mjs (weekly, and on PRs touching this file or the
# lockfile), which fails when an entry's advisory gains a patched release for an installed
# version, no longer matches any installed version, or is withdrawn — and fails closed when
# it cannot verify. Tests: scripts/audit-allowlist-expiry.test.mjs.
auditConfig:
  ignoreGhsas:
    # GHSA-mh99-v99m-4gvg (brace-expansion DoS) was allowlisted here because no patched
    # 1.x existed. One does now — 1.1.17 — so the entry's own expiry condition (#881) is
    # met and it is gone rather than renewed. The `brace-expansion@1` override in the root
    # package.json (`>=1.1.20 <2` since #1151; it was pinned to 1.1.18 before) clears BOTH
    # that advisory and the newer GHSA-rgw5-rvv9-x895 (first patched 1.x: 1.1.18). Do not
    # re-add either GHSA: an allowlist entry is for an advisory with no patched release
    # inside the affected major, and both now have one.
    # GHSA-qwww-vcr4-c8h2 (react-router RSC-mode CSRF) was allowlisted here while no 7.x
    # backport existed. 7.18.2 is now the first patched 7.x and the lockfile resolves it, so
    # the entry suppressed nothing; removed when the expiry check (#1152) flagged it (#882).
    # braces stack-exhaustion DoS (high, <=3.0.3). NO patched release exists: the advisory's
    # first_patched_version is null, npm latest is 3.0.3 (2024-05-21) and upstream
    # micromatch/braces#70 has no fix (all checked 2026-10-03). Reached only through
    # fast-glob → micromatch in dev/build tooling (astro-eslint-parser, purgecss), on
    # repo-owned glob patterns; nothing in the published site or the API. Expiry: #1149.
    - GHSA-vfj7-8cjw-p6xm
    # http-cache-semantics max-stale shared-cache disclosure (high, <=4.2.0). NO patched
    # release exists: first_patched_version is null, npm latest is 4.2.0 (2025-05-09),
    # upstream kornelski/http-cache-semantics#56 has no fix (checked 2026-10-03). Reached
    # only through astro's build-time remote-image TTL (assets/build/remote.js), whose
    # requests Astro constructs itself — no client max-stale header reaches it, and it is
    # not a multi-user cache. Expiry: #1150.
    - GHSA-ch52-4w7c-c8xp
